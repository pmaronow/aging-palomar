limitations:
  - >-
    Formal assertions are the exact Lean statements and their standing
    hypotheses. The selected Comparator check covers both statements, definitions
    and proof dependencies; it does not independently validate every sentence
    of manuscript prose or every proof-library source.
  - >-
    The physical response derivative is into terminal L2 of the projected
    nonlinear restart. Its physical response-kernel Duhamel representation
    is proved for bounded continuous deterministic forcing and bounded
    continuous adapted random directions. General predictable L2 sources
    are treated by the affine variational equation; a physical U-kernel
    representation for every deterministic L2_loc control is not asserted.
    A full nonlinear forced-solution Frechet theorem in that domain or a
    simultaneous samplewise smooth flow in all initial points is not asserted.
  - >-
    Chronological slow fluctuation-dissipation ratio, a matching susceptibility
    upper bound and an identified aging clock remain open predictions and
    are excluded from proved-result coverage.
