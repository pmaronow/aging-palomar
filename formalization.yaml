version: "v0.4"
project:
  name: "Aging in Spherical Spin Glass Dynamics"
  description: >-
    Lean formalization of the spherical Gaussian spin-glass dynamics and its
    positive-semidefinite Cugliandolo--Kurchan limit, including the physical
    variational response, entropy and Fisher estimates, stationary translated
    clusters, general-spin selection and aging bounds, and stationary
    relaxation. Theorem 11.4 covers every integer p >= 3 and beta > 0. The
    cubic product inequality includes beta = beta_d; strictly positive
    Fisher-cost conclusions require beta > beta_d. The root Challenge
    retains the original complete-conclusions theorem with the five principal
    theorem groups and all-spin forward theorem, sharing CK, stationary-profile,
    dimension-subsequence, density and Fisher-majorant witnesses. The same file
    separately retains the original Proposition 5.7 statement for every CK
    solution, every late sequence and every raw translated cluster.
  authors:
    - "P. M. Aronow"
    - "Patrick Lopatto"
  responsible_maintainers:
    - "P. M. Aronow"
  license: MIT
classification:
  arxiv:
    - math.PR
    - math.AP
  msc2020:
    - 60H10
    - 82D30
    - 60G15
automation:
  methods:
    - method: autonomous
      models: ["GPT-6"]
      framework: "OpenAI Codex with parallel collaborating agents"
      tool_setup: >-
        OpenAI Codex based on GPT-6 with parallel collaborating agents,
        Lean 4.35.0-rc2, pinned Mathlib, Lean's bundled Comparator, NanoDa
        and con-ron. Exact dependency revisions are pinned in the Lean/Lake
        configuration; reused providers retain source attribution and licenses
        under vendor/.
      notes: >-
        Autonomous agents implemented proofs, reviewed manuscript-to-Lean
        correspondence, corrected mathematical assumptions and proof routes,
        and checked bibliographic attribution against original sources.
        This automated contribution is disclosed separately from human authorship.
review:
  status: agent-reviewed
  reviewers:
    - "OpenAI Codex parallel mathematical, correspondence and trust-chain agents"
  notes: >-
    The compact claim ledger distinguishes 84 numbered arguments, 13
    mathematical remarks and one example from two interpretive cautions.
    Exact declarations and hypotheses govern the formalized claims. One
    independently readable Mathlib-only Challenge contains both original
    theorem statements, selected together by one configuration. The selected
    root Solution retains the original Proposition 5.7 proof and connects the
    complete-conclusions theorem to the included proof library.
    Each Challenge target is intentionally left unproved as a specification.
    The proved Solution and library permit only propext, Classical.choice and
    Quot.sound. The standard entry files are Challenge.lean, Solution.lean and
    comparator.json; the complete proof closure contains 1919 modules, including
    1918 library modules. Current reproducibility commands are in README.md.
    The current GitHub repository is private; public visibility is required
    before Palomar intake.
    Agent review and local mechanical checks do not constitute human peer review,
    Palomar registration or an editorial assessment.
